<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeopardy Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grid" id="grid"></div>

  <div id="overlay" class="overlay hidden">
    <div class="overlay-content">
      <div id="overlay-title" class="overlay-title hidden"></div>
      <div id="overlay-question" class="overlay-question"></div>
      <div id="overlay-answer" class="overlay-answer hidden"></div>
      <div id="overlay-help" class="overlay-help hidden">
        SPACE = reveal answer • ESC = close
      </div>
    </div>
  </div>

  <div id="timer" class="timer hidden">30</div>
  <script src="index.js" defer></script>
</body>
</html>
